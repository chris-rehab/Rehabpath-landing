# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
# The .xcodeproj is not committed — this file is the source of truth.
name: RehabPath
options:
  bundleIdPrefix: nz.co.rehabpath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-NZ
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RehabPathCore:
    path: Packages/RehabPathCore
targets:
  RehabPath:
    type: application
    platform: iOS
    sources:
      - path: RehabPath
    dependencies:
      - package: RehabPathCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.rehabpath.app
        INFOPLIST_FILE: RehabPath/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RehabPathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RehabPathTests
    dependencies:
      - target: RehabPath
      - package: RehabPathCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RehabPathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RehabPathUITests
    dependencies:
      - target: RehabPath
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RehabPath:
    build:
      targets:
        RehabPath: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - RehabPath
      targets:
        - RehabPathTests
        - RehabPathUITests
