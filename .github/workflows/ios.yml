name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Compliance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ios/scripts/compliance_check.py

  core-tests:
    name: RehabPathCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/RehabPathCore

  app-tests:
    name: App build, unit + UI tests (iOS Simulator)
    needs: [compliance, core-tests]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          cd ios
          set -o pipefail
          xcodebuild test \
            -project RehabPath.xcodeproj \
            -scheme RehabPath \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Core tests on macOS
        run: swift test --package-path ios/Packages/RehabPathCore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
